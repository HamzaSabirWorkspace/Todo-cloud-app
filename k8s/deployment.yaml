apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  labels:
    app: todo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo
  template:
    metadata:
      labels:
        app: todo
    spec:
      containers:
      - name: todo-app
        image: i221322/todo-app:latest # Replace with actual image
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
