---
- name: Configure EC2 for Kubernetes
  hosts: all
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present

    - name: Install MicroK8s
      snap:
        name: microk8s
        classic: yes

    - name: Wait for MicroK8s to be ready
      command: microk8s status --wait-ready
      changed_when: false

    - name: Add user to microk8s group
      user:
        name: ubuntu
        groups: microk8s
        append: yes

    - name: Enable MicroK8s addons
      command: microk8s enable dns dashboard storage

    - name: Create kube config directory for ubuntu user
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Write kube config for kubectl and ArgoCD setup
      shell: microk8s config > /home/ubuntu/.kube/config
      args:
        creates: /home/ubuntu/.kube/config

    - name: Set kube config ownership
      file:
        path: /home/ubuntu/.kube/config
        owner: ubuntu
        group: ubuntu
        mode: "0600"
